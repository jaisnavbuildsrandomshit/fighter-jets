<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fighter Jets</title>
<meta name="description" content="Seven aircraft, twenty seconds each: a fly-through presentation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root { --amber: #ffb22e; --hud: #f4f7fb; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body.cursor { cursor: default; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    background: #05070a; color: #fff; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .scene.on { visibility: visible; }
  #shaker { position: absolute; inset: 0; }
  /* feathered frame edges while the camera whips (animated via --f) */
  .scene .bgl { --f: 0%;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%), linear-gradient(0deg, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%), linear-gradient(0deg, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%);
    mask-composite: intersect; }
  #backdrop { position: absolute; inset: -12%; width: 124%; height: 124%; object-fit: cover; filter: blur(28px) brightness(.9) saturate(1.1); }
  .cam, .bgl { position: absolute; inset: 0; will-change: transform; }
  .streak { position: absolute; max-width: none; opacity: 0; pointer-events: none; }
  .photo { position: absolute; max-width: none; user-select: none; }
  .vid { position: absolute; max-width: none; user-select: none; }
  .vid.yt { overflow: hidden; pointer-events: none; }
  /* player rendered at 2x then scaled down: sharper picture, and YouTube's centre icon ends up half size */
  .vid.yt iframe { position: absolute; left: -6%; top: -12%; width: 224%; height: 248%; transform: scale(.5); transform-origin: 0 0; border: 0; pointer-events: none; }
  .shade { position: absolute; inset: -6%; pointer-events: none; }

  /* the flying jet + afterburners */
  .jet { display: none !important; }
  .jet img { position: absolute; inset: 0; width: 100%; height: 100%; filter: contrast(1.08) saturate(1.1) drop-shadow(0 30px 40px rgba(0,0,0,.35)); }
  .flames { position: absolute; inset: 0; }
  .flame { position: absolute; transform-origin: 50% 0; mix-blend-mode: screen; }
  .flame i { position: absolute; left: 50%; top: 0; transform: translateX(-50%); border-radius: 50% 50% 50% 50% / 12% 12% 88% 88%; }
  .flame .glow { width: 260%; height: 60%; top: -18%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,190,90,.85), rgba(255,110,20,.35) 45%, rgba(255,80,0,0) 70%); filter: blur(6px); }
  .flame .cone { width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,236,200,.95) 0%, rgba(255,170,60,.85) 22%, rgba(255,90,30,.5) 55%, rgba(255,60,20,0) 100%);
    filter: blur(2px); animation: roar .06s infinite alternate; }
  .flame .core { width: 46%; height: 38%;
    background: linear-gradient(to bottom, #fff 0%, #dff3ff 40%, rgba(140,190,255,0) 100%); filter: blur(1px); }
  .flame .dia { width: 40%; height: 70%; top: 10%;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.55) 0 6%, rgba(255,255,255,0) 6% 18%); filter: blur(1.5px); opacity: .7;
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent); mask-image: linear-gradient(to bottom, #000, transparent); }
  @keyframes roar { from { transform: translateX(-50%) scaleY(.94) scaleX(.97); opacity: .9 } to { transform: translateX(-50%) scaleY(1.06) scaleX(1.03); opacity: 1 } }

  /* tactical callouts */
  svg.calls { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  svg.calls g.co { opacity: 0; filter: drop-shadow(0 0 4px rgba(0,0,0,.65)); }
  /* classifications decoder */
  .cls { position: absolute; left: 100px; right: 100px; top: 300px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 56px; }
  .cls h4 { margin: 0 0 8px; padding-bottom: 12px; border-bottom: 2px solid var(--amber); font-family: "Share Tech Mono", monospace; font-weight: 400; font-size: 26px; letter-spacing: .28em; color: var(--amber); }
  .cls .row { display: flex; align-items: baseline; gap: 18px; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,.12); }
  .cls .row b { flex: 0 0 178px; white-space: nowrap; font-family: "Archivo Black", sans-serif; font-weight: 400; font-size: 30px; color: #fff; letter-spacing: .01em; }
  .cls .row span { font-family: "Inter", sans-serif; font-size: 23px; line-height: 1.3; color: #d8e2ee; }
  /* centre HUD pipper on game-trailer scenes (also covers YouTube's paused icon) */
  .pip { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; opacity: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(6,9,12,.96) 0 62%, rgba(6,9,12,.0) 63%); border: 2px solid #7dffa0; box-shadow: 0 0 8px rgba(125,255,160,.35); }
  .pip::before, .pip::after { content: ""; position: absolute; background: #7dffa0; }
  .pip::before { left: -14px; right: -14px; top: 50%; height: 2px; margin-top: -1px; -webkit-mask: linear-gradient(90deg, #000 0 12px, transparent 12px calc(100% - 12px), #000 calc(100% - 12px)); mask: linear-gradient(90deg, #000 0 12px, transparent 12px calc(100% - 12px), #000 calc(100% - 12px)); }
  .pip::after { top: -14px; bottom: -14px; left: 50%; width: 2px; margin-left: -1px; -webkit-mask: linear-gradient(180deg, #000 0 12px, transparent 12px calc(100% - 12px), #000 calc(100% - 12px)); mask: linear-gradient(180deg, #000 0 12px, transparent 12px calc(100% - 12px), #000 calc(100% - 12px)); }
  .pip i { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: #ff3d3d; box-shadow: 0 0 8px #ff3d3d; }
  /* callouts: Ace Combat lock-on reticle + Watch Dogs profiler card */
  svg.calls .ld { fill: none; stroke: #7dffa0; stroke-width: 2; stroke-dasharray: none; opacity: .9; }
  svg.calls .tick { stroke: #7dffa0; stroke-width: 3; }
  svg.calls .dia { fill: none; stroke: #7dffa0; stroke-width: 2.5; }
  svg.calls .ret { fill: rgba(255,61,61,.06); stroke: #7dffa0; stroke-width: 2.6; }
  svg.calls .lk { font-family: "Share Tech Mono", monospace; font-size: 19px; letter-spacing: .18em; fill: #ff3d3d; opacity: 0; }
  svg.calls .dot { fill: #ff3d3d; }
  svg.calls .pulse { fill: none; stroke: #ff3d3d; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(3.4); opacity: 0 } }
  .lab { position: absolute; opacity: 0; pointer-events: none; white-space: nowrap; }
  .lab.r { transform: translateX(-100%); }
  .lab .plate { position: relative; overflow: hidden; padding: 0 0 11px; background: rgba(8,10,14,.78); border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  .lab.r .plate { text-align: right; }
  .lab .hdr { display: block; background: #f2f4f6; color: #0a0c10; font-family: "Share Tech Mono", monospace; font-size: 15px; letter-spacing: .14em; padding: 4px 12px; margin-bottom: 8px; }
  .lab .hdr em { font-style: normal; background: #0a0c10; color: #f2f4f6; padding: 0 6px; margin-right: 9px; }
  .lab b { display: block; padding: 0 14px; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 34px; letter-spacing: .05em; line-height: 1; color: #fff; white-space: nowrap; }
  .lab .d { display: block; padding: 0 14px; margin-top: 6px; font-family: "Share Tech Mono", monospace; font-size: 20px; color: #cfd8e2; white-space: nowrap; }
  .lab .scan { position: absolute; left: 0; top: 0; bottom: 0; width: 26%; background: linear-gradient(90deg, rgba(125,255,160,0), rgba(125,255,160,.35), rgba(125,255,160,0)); }
  .plate.gl { animation: glitch .42s steps(1) both; }
  @keyframes glitch {
    0%   { transform: translate(-14px, 0) skewX(-8deg); clip-path: inset(0 0 72% 0); filter: drop-shadow(4px 0 0 #ff2bd6) drop-shadow(-4px 0 0 #18e7ff); }
    16%  { transform: translate(10px, 0); clip-path: inset(55% 0 8% 0); }
    32%  { transform: translate(-6px, 0); clip-path: inset(18% 0 40% 0); filter: drop-shadow(-5px 0 0 #ff2bd6) drop-shadow(5px 0 0 #18e7ff); }
    48%  { transform: translate(4px, 0) skewX(5deg); clip-path: inset(0 0 0 0); }
    64%  { transform: translate(-2px, 0); clip-path: inset(40% 0 30% 0); }
    80%  { transform: translate(1px, 0); clip-path: inset(0 0 0 0); filter: drop-shadow(2px 0 0 #ff2bd6) drop-shadow(-2px 0 0 #18e7ff); }
    100% { transform: none; clip-path: inset(0 0 0 0); filter: none; }
  }

  /* type */
  .text { position: absolute; inset: 0; pointer-events: none; }
  .kicker { position: absolute; left: 70px; right: 70px; top: 52px; display: flex; align-items: center; gap: 18px; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .kicker .tag { font-family: "Share Tech Mono", monospace; font-size: 22px; color: #05070a; background: var(--amber); padding: 3px 9px; }
  .kicker .mdl { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 34px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .kicker .rule { flex: 1; height: 2px; background: rgba(255,255,255,.75); transform-origin: left; }
  .kicker .mk { font-family: "Share Tech Mono", monospace; font-size: 20px; letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; opacity: .9; }
  .head { position: absolute; left: 96px; font-family: "Archivo Black", sans-serif; font-size: 150px; line-height: .9; text-transform: uppercase;
    color: #fff; text-shadow: 0 8px 50px rgba(0,0,0,.45); }
  .head .ln { display: block; overflow: hidden; padding-bottom: .05em; }
  .head .ln > span { display: inline-block; }
  .sub { position: absolute; left: 102px; top: 400px; font-family: "Share Tech Mono", monospace; font-size: 28px; letter-spacing: .3em; color: var(--amber); }
  .specs { position: absolute; right: 80px; bottom: 80px; display: flex; gap: 64px; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
  .specs.left { right: auto; left: 96px; }
  .specs.top { bottom: auto; top: 120px; }
  .spec small { display: block; font-family: "Share Tech Mono", monospace; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: var(--amber); }
  .spec b { display: block; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 72px; line-height: 1; }
  .credit { position: absolute; right: 70px; bottom: 26px; font-size: 15px; opacity: .65; text-shadow: 0 1px 6px rgba(0,0,0,.7); }

  .tl { position: absolute; left: 110px; right: 110px; top: 560px; }
  .tl .axis { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: rgba(255,255,255,.9); transform-origin: left; }
  .tl .node { position: absolute; top: -120px; width: 330px; }
  .tl .yr { font-family: "Archivo Black", sans-serif; font-size: 76px; }
  .tl .yr.hot { color: var(--amber); }
  .tl .dot { position: absolute; top: 110px; left: 0; width: 22px; height: 22px; border-radius: 50%; background: #fff; transform: translateX(-50%); box-shadow: 0 0 0 6px rgba(255,255,255,.18); }
  .tl .nm { margin-top: 56px; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 50px; }
  .tl .ds { font-family: "Share Tech Mono", monospace; font-size: 22px; color: #d8e2ee; }
  .btn { position: absolute; right: 96px; bottom: 170px; pointer-events: auto; cursor: pointer; font-family: "Barlow Condensed", sans-serif; font-weight: 700;
    font-size: 30px; letter-spacing: .2em; padding: 18px 38px; background: var(--amber); color: #05070a; border: 0; }

  /* overlays */
  #lbt, #lbb { position: absolute; left: 0; right: 0; height: 0; background: #000; z-index: 58; pointer-events: none; }
  #lbt { top: 0; } #lbb { bottom: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 59; pointer-events: none; mix-blend-mode: screen; }
  #vignette { position: absolute; inset: 0; z-index: 60; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.5) 100%); }
  #grain { display: none; position: absolute; inset: -50%; z-index: 61; pointer-events: none; opacity: .06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain .5s steps(4) infinite; }
  @keyframes grain { 0% { transform: translate(0,0) } 25% { transform: translate(-3%,2%) } 50% { transform: translate(2%,-3%) } 75% { transform: translate(-2%,-1%) } 100% { transform: translate(1%,3%) } }
  #bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 5px; z-index: 70; background: var(--amber); transform-origin: left; transform: scaleX(0); }
  #count { position: absolute; z-index: 70; left: 70px; bottom: 24px; font-family: "Share Tech Mono", monospace; font-size: 20px; letter-spacing: .2em; opacity: .75; }
  #notes { position: absolute; z-index: 80; left: 50%; bottom: 70px; transform: translateX(-50%); width: 1200px; padding: 22px 28px; display: none;
    background: rgba(6,9,14,.88); border-left: 4px solid var(--amber); font-size: 26px; line-height: 1.5; }
  #notes.show { display: block; }
  #curtain { position: absolute; inset: 0; z-index: 90; background: #000; }
  #ready { position: absolute; inset: 0; z-index: 95; display: grid; place-items: center; opacity: 0; pointer-events: none;
    font-family: "Share Tech Mono", monospace; color: #fff; text-align: center; }
  #ready .t { font-family: "Archivo Black", sans-serif; font-size: 64px; letter-spacing: .02em; }
  #ready .s { margin-top: 26px; font-size: 22px; letter-spacing: .4em; color: var(--amber); animation: blink 1.4s steps(2) infinite; }
  #ready .h { margin-top: 70px; font-size: 17px; letter-spacing: .2em; opacity: .55; }
  @keyframes blink { 50% { opacity: .25 } }
  #fx, .streak { display: none !important; }
  #fx img { position: absolute; left: 0; top: 0; width: 1400px; opacity: 0; filter: blur(5px) brightness(1.08); will-change: transform, opacity; }
</style>
</head>
<body>
<div id="stage">
  <img id="backdrop" alt="">
  <div id="shaker"><div id="fx"><img src="img/cloud1.png" alt=""><img src="img/cloud2.png" alt=""></div></div>
  <div id="lbt"></div><div id="lbb"></div><div id="flash"></div>
  <div id="vignette"></div><div id="grain"></div>
  <div id="bar"></div><div id="count"></div><div id="notes"></div>
  <div id="curtain"></div>
  <div id="ready"><div><div class="t">FIGHTER JETS</div><div class="s">CLICK OR PRESS ANY KEY</div><div class="h">→ NEXT  ·  ← BACK  ·  P PAUSE  ·  N NOTES  ·  F FULLSCREEN</div></div></div>
</div>
<script src="scenes.js"></script>
<script src="engine.js"></script>
<script>
  // show the cursor only while the mouse moves
  let ct; addEventListener("pointermove", () => { document.body.classList.add("cursor"); clearTimeout(ct); ct = setTimeout(() => document.body.classList.remove("cursor"), 1500); });
</script>
</body>
</html>
